name: Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build Web Bundle
        run: |
          cd web
          bun install
          bun run build
      - name: Upload Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/index.html

  build-plugin:
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: so
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: so
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: dylib
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: dylib
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Download Frontend Dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: Install aarch64 gcc for linux/arm64
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build CGO Plugin
        shell: bash
        env:
          CGO_ENABLED: '1'
          EXT: ${{ matrix.ext }}
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          go mod tidy
          PLUGIN_ID="cpa-models-speed-test"
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "${{ github.ref_name }}" ]; then
            VERSION="1.0.0"
          fi

          if [ "${TARGET_GOOS}" = "linux" ] && [ "${TARGET_GOARCH}" = "arm64" ]; then
            export CC="aarch64-linux-gnu-gcc"
          fi

          if [ "${TARGET_GOOS}" = "darwin" ] && [ "${TARGET_GOARCH}" = "amd64" ]; then
            export CC="clang -arch x86_64"
          fi

          export GOOS="${TARGET_GOOS}"
          export GOARCH="${TARGET_GOARCH}"

          LIB_NAME="${PLUGIN_ID}.${EXT}"
          go build -buildmode=c-shared -o "${LIB_NAME}" .

          ZIP_NAME="${PLUGIN_ID}_${VERSION}_${TARGET_GOOS}_${TARGET_GOARCH}.zip"
          if command -v zip >/dev/null 2>&1; then
            zip -j "${ZIP_NAME}" "${LIB_NAME}"
          else
            powershell -Command "Compress-Archive -Path '${LIB_NAME}' -DestinationPath '${ZIP_NAME}'"
          fi

      - name: Upload Built Zip
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cpa-models-speed-test_*.zip

  publish-release:
    needs: build-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download All Archives
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: release-assets

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/*.zip
            release-assets/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
